<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar - Mi hogar inteligente</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Configuracion-Hogar.css">
</head>

<body>

    <main class="contenedor-principal">

        <header class="encabezado">
            <div class="barra-progreso" role="progressbar" aria-valuenow="3" aria-valuemin="1" aria-valuemax="3">
                <div class="progreso activo"></div>
                <div class="progreso activo"></div>
                <div class="progreso activo"></div>
            </div>

            <span class="numero-paso">PASO 3 DE 3</span>
            <h1>Selecciona tus zonas iniciales</h1>
            <p class="descripcion">Elige las habitaciones o espacios principales que deseas gestionar en tu hogar.</p>
        </header>

        <form id="formulario-paso3" class="contenido" novalidate>

            <!-- Selección de Zonas (Checkboxes/Cards) -->
            <div class="grupo-formulario">
                <div class="red-zonas">

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Sala de estar" checked>
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">living</span>
                            <span class="nombre-zona">Sala de estar</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Habitación principal" checked>
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">bed</span>
                            <span class="nombre-zona">Habitación principal</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Cocina">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">countertops</span>
                            <span class="nombre-zona">Cocina</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Comedor">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">dining</span>
                            <span class="nombre-zona">Comedor</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Baño principal">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">shower</span>
                            <span class="nombre-zona">Baño principal</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Estudio / Oficina">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">desk</span>
                            <span class="nombre-zona">Estudio / Oficina</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Jardín / Patio">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">yard</span>
                            <span class="nombre-zona">Jardín / Patio</span>
                        </div>
                    </label>

                    <label class="tarjeta-zona">
                        <input type="checkbox" name="zonas[]" value="Garaje">
                        <div class="contenido-tarjeta">
                            <span class="material-symbols-outlined icono-zona">garage</span>
                            <span class="nombre-zona">Garaje</span>
                        </div>
                    </label>

                </div>

                <span id="mensaje-error-zonas" class="mensaje-error" aria-live="polite"></span>
                <p class="ayuda">Podrás agregar, modificar o eliminar zonas en cualquier momento desde los ajustes.</p>
            </div>

            <!-- Navegación final -->
            <footer class="pie pie-doble-boton">
                <a href="Configuracion-Paso2.html" class="boton-atras">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span>Atrás</span>
                </a>
                <button type="submit" id="boton-finalizar" class="boton-siguiente">
                    <span id="texto-boton">Finalizar configuración</span>
                    <span class="material-symbols-outlined">check_circle</span>
                </button>
            </footer>

        </form>

    </main>

    <script src="js/Configuracion-Paso3.js"></script>
</body>

</html>
