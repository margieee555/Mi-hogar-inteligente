<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar - Mi hogar inteligente</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Configuracion-Hogar.css">
</head>

<body>

    <main class="contenedor-principal">

        <header class="encabezado">
            <div class="barra-progreso" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="3">
                <div class="progreso activo"></div>
                <div class="progreso activo"></div>
                <div class="progreso"></div>
            </div>

            <span class="numero-paso">PASO 2 DE 3</span>
            <h1>Invita a tu familia</h1>
            <p class="descripcion">Añade la dirección de tu vivienda e invita a los miembros que compartirán la gestión del hogar.</p>
        </header>

        <form id="formulario-paso2" class="contenido" novalidate>

            <div class="grupo-formulario">
                <label for="direccion-hogar">Dirección de la residencia <span class="opcional">(Opcional)</span></label>
                <input 
                     type="text" 
                    id="direccion-hogar" 
                    class="entrada-texto"
                    name="direccionHogar"
                    placeholder="Ej: Calle 123 # 45-67, Apto 402" 
                    maxlength="100"
                    autocomplete="off"
                >
            </div>

            <!-- Grupo 2: Correos de Invitación Dinámicos -->
            <div class="grupo-formulario">
                <div class="encabezado-invitaciones">
                    <label>Correos de invitados</label>
                    <button type="button" id="boton-agregar-invitado" class="boton-agregar">
                        <span class="material-symbols-outlined">add</span>
                        <span>Añadir otro</span>
                    </button>
                </div>

                <div id="lista-invitados" class="lista-invitados">
                    <div class="fila-invitado">
                        <input 
                            type="email" 
                            class="correo-invitado" 
                            name="correosInvitados[]"
                            placeholder="Ej: familiar@ejemplo.com" 
                            autocomplete="off"
                        >
                        <button type="button" class="boton-eliminar-invitado" aria-label="Eliminar invitado" style="display: none;">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                </div>
                <span id="mensaje-invitados" class="mensaje-error" aria-live="polite"></span>
                <p class="ayuda">Enviaremos un correo electrónico para que tus familiares o compañeros se unan a este espacio.</p>
            </div>

            <footer class="pie pie-doble-boton">
                <a href="Configuracion-Hogar.html" class="boton-atras">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span>Atrás</span>
                </a>
                <button type="submit" id="boton-siguiente" class="boton-siguiente">
                    <span id="texto-boton">Siguiente paso</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </footer>

        </form>

    </main>

    <script src="js/Configuracion-Paso2.js"></script>
</body>

</html>
