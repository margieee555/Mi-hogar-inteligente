
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio - mi hogar inteligente</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor-principal">

        <header class="encabezado">

            <div class="barra-progreso">

                <div class="progreso activo"></div>

                <div class="progreso"></div>

                <div class="progreso"></div>

            </div>

            <span class="numero-paso">
                PASO 1 DE 3
            </span>

            <h1>
                ¡Bienvenido a Hogar360!
            </h1>

            <p class="descripcion">
                Vamos a configurar algunos datos básicos de tu hogar.
            </p>

        </header>

        <section class="contenido">

            <div class="grupo-formulario">

                <label for="nombre-hogar">
                    Nombre del hogar
                </label>

                <input
                    type="text"
                    id="nombre-hogar"
                    placeholder="Ej: Casa García, Mi apartamento"
                    maxlength="50"
                >

                <span id="mensaje-nombre" class="mensaje-error"></span>

            </div>

            <div class="grupo-formulario">

                <label>
                    Tipo de vivienda
                </label>

                <div class="opciones-vivienda">

                    <button
                        type="button"
                        class="tarjeta-vivienda seleccionada"
                        data-vivienda="Casa"
                    >

                        <span class="material-symbols-outlined icono-vivienda">
                            home
                        </span>

                        <span class="nombre-vivienda">
                            Casa
                        </span>

                    </button>

                    <button
                        type="button"
                        class="tarjeta-vivienda"
                        data-vivienda="Apartamento"
                    >

                        <span class="material-symbols-outlined icono-vivienda">
                            apartment
                        </span>

                        <span class="nombre-vivienda">
                            Apartamento
                        </span>

                    </button>

                    <button
                        type="button"
                        class="tarjeta-vivienda"
                        data-vivienda="Estudio"
                    >

                        <span class="material-symbols-outlined icono-vivienda">
                            night_shelter
                        </span>

                        <span class="nombre-vivienda">
                            Estudio
                        </span>

                    </button>

                    <button
                        type="button"
                        class="tarjeta-vivienda"
                        data-vivienda="Otro"
                    >

                        <span class="material-symbols-outlined icono-vivienda">
                            domain
                        </span>

                        <span class="nombre-vivienda">
                            Otro
                        </span>

                    </button>

                </div>

            </div>

            <div class="grupo-formulario">

                <label>
                    Número de residentes
                </label>

                <div class="contador">

                    <button
                        type="button"
                        id="boton-disminuir"
                        class="boton-contador"
                        aria-label="Disminuir residentes"
                    >

                        <span class="material-symbols-outlined">
                            remove
                        </span>

                    </button>


                    <span
                        id="cantidad-residentes"
                        class="cantidad-residentes"
                    >
                        1
                    </span>


                    <button
                        type="button"
                        id="boton-aumentar"
                        class="boton-contador"
                        aria-label="Aumentar residentes"
                    >

                        <span class="material-symbols-outlined">
                            add
                        </span>

                    </button>

                </div>

                <p class="ayuda">
                    Puedes registrar entre 1 y 20 residentes.
                </p>

            </div>

        </section>

        <footer class="pie">

            <button
                type="button"
                id="boton-siguiente"
                class="boton-siguiente"
            >
                <span>
                    Siguiente paso
                </span>

                <span class="material-symbols-outlined">
                    arrow_forward
                </span>

            </button>

        </footer>

    </main>

    <script src="js/scripts.js"></script>

</body>
</html>
