<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Añadir Miembro - Mi Hogar Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Añadir-Mienbros.css">
</head>
<body class="page-body">
    <!-- Contenedor general que se adapta a PC y móvil -->
    <div class="app-container">
        <!-- TopAppBar -->
        <header class="top-app-bar">
            <button aria-label="Volver" class="icon-button" type="button">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="header-title">Añadir Miembro</h1>
        </header>

        <!-- Main Content Canvas -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Name Input -->
                <div class="form-group">
                    <label class="form-label" for="memberName">Nombre del Residente</label>
                    <div class="input-container">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input class="text-input" id="memberName" placeholder="Ej. Abuelo, Primo, Ayudante" type="text">
                    </div>
                </div>

                <!-- Role / Avatar Selection -->
                <div class="form-group">
                    <label class="form-label">Selecciona un Perfil</label>
                    <div class="avatar-grid" id="avatarGrid">
                        <button class="avatar-btn selected" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 1;">face</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">face_2</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">face_3</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">face_4</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">face_5</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">face_6</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">child_care</span>
                        </button>
                        <button class="avatar-btn" type="button">
                            <span class="material-symbols-outlined avatar-symbol" style="font-variation-settings: 'FILL' 0;">pets</span>
                        </button>
                    </div>
                </div>

                <!-- Permission Level -->
                <div class="form-group">
                    <label class="form-label">Nivel de Permiso</label>
                    <div class="permission-list" id="permissionList">
                        <!-- Admin Option -->
                        <label class="permission-card">
                            <input class="sr-only" name="permission" type="radio" value="admin">
                            <div class="permission-info">
                                <div class="permission-icon-container">
                                    <span class="material-symbols-outlined">manage_accounts</span>
                                </div>
                                <div>
                                    <h3 class="permission-title">Administrador</h3>
                                    <p class="permission-desc">Control total del hogar, finanzas y configuraciones.</p>
                                </div>
                            </div>
                            <div class="radio-box">
                                <div class="radio-dot"></div>
                            </div>
                        </label>

                        <!-- Member Option -->
                        <label class="permission-card active">
                            <input checked class="sr-only" name="permission" type="radio" value="member">
                            <div class="permission-info">
                                <div class="permission-icon-container active-icon">
                                    <span class="material-symbols-outlined">person_add</span>
                                </div>
                                <div>
                                    <h3 class="permission-title">Miembro</h3>
                                    <p class="permission-desc">Acceso estándar. Puede ver y gestionar tareas diarias.</p>
                                </div>
                            </div>
                            <div class="radio-box active-box">
                                <div class="radio-dot active-dot"></div>
                            </div>
                        </label>

                        <!-- Guest Option -->
                        <label class="permission-card">
                            <input class="sr-only" name="permission" type="radio" value="guest">
                            <div class="permission-info">
                                <div class="permission-icon-container">
                                    <span class="material-symbols-outlined">visibility</span>
                                </div>
                                <div>
                                    <h3 class="permission-title">Invitado</h3>
                                    <p class="permission-desc">Acceso limitado. Solo visualización de áreas específicas.</p>
                                </div>
                            </div>
                            <div class="radio-box">
                                <div class="radio-dot"></div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Notes Field -->
                <div class="form-group">
                    <label class="form-label" for="memberNotes">Notas o Parentesco</label>
                    <div class="input-container">
                        <span class="material-symbols-outlined input-icon textarea-icon">description</span>
                        <textarea class="text-input textarea-input" id="memberNotes" placeholder="Añade detalles adicionales..." rows="3"></textarea>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Action Bar -->
        <div class="action-bar">
            <button class="primary-action-btn" type="button">
                <span class="material-symbols-outlined">save</span>
                Guardar Residente
            </button>
        </div>
    </div>

    <script src="js/Añadir-Mienbros.js"></script>
</body>
</html>
