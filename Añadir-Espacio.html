<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Añadir espacio personalizado - Mi Hogar Inteligente</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Añadir-Espacio.css">
</head>
<body class="page-body">
    <!-- TopAppBar -->
    <header class="top-app-bar">
        <div class="header-container">
            <button class="icon-button" type="button">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="header-title">Nuevo Espacio - Mi Hogar Inteligente</h1>
            <button class="icon-button" type="button">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Background Animation Effect -->
        <div class="bg-animation"></div>

        <!-- Section: Name -->
        <section class="card-section">
            <label class="section-label" for="spaceName">Nombre del espacio inteligente</label>
            <p class="section-subtitle">Ej. Sala domótica, Cocina inteligente, Oficina</p>
            <input class="text-input" id="spaceName" placeholder="Escribe el nombre aquí..." type="text">
        </section>

        <!-- Section: Icon Selection -->
        <section class="card-section">
            <h2 class="section-title">Seleccionar icono</h2>
            <div class="icon-grid" id="iconGrid">
                <!-- Icon Buttons -->
                <button class="icon-btn selected" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 1;">chair</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">bed</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">countertops</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">local_florist</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">garage</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">build</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">laptop_mac</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">toys</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">balcony</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">restaurant</span>
                </button>
                <button class="icon-btn" type="button">
                    <span class="material-symbols-outlined icon-symbol" style="font-variation-settings: 'FILL' 0;">inventory_2</span>
                </button>
            </div>
        </section>

        <!-- Section: Color Selection -->
        <section class="card-section">
            <h2 class="section-title">Color distintivo</h2>
            <div class="color-row" id="colorRow">
                <!-- Color Dots -->
                <button aria-label="Azul" class="color-btn color-primary-container selected" type="button"></button>
                <button aria-label="Verde" class="color-btn color-secondary" type="button"></button>
                <button aria-label="Naranja" class="color-btn color-tertiary-container" type="button"></button>
                <button aria-label="Rojo" class="color-btn color-error" type="button"></button>
                <button aria-label="Azul Tint" class="color-btn color-surface-tint" type="button"></button>
                <button aria-label="Gris" class="color-btn color-outline" type="button"></button>
            </div>
        </section>

        <!-- Primary Action Button -->
        <div class="action-container">
            <button class="primary-action-btn" type="button">
                <span class="material-symbols-outlined">add_circle</span>
                Crear espacio inteligente
            </button>
        </div>
    </main>

    <!-- BottomNavBar -->
    <nav class="bottom-nav">
        <a class="nav-item active" href="#">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
            <span class="sr-only">home</span>
        </a>
        <a class="nav-item" href="#">
            <span class="material-symbols-outlined">group_add</span>
            <span class="sr-only">group_add</span>
        </a>
        <a class="nav-item" href="#">
            <span class="material-symbols-outlined">settings</span>
            <span class="sr-only">Settings</span>
        </a>
    </nav>
    <script src="js/Añadir-Espacio.js"></script>
</body>
</html>
