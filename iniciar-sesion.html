<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión - Mi hogar inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Estilos-Globales.css">
    <link rel="stylesheet" href="css/Iniciar-Sesion.css">
</head>
<body>
    <main class="contenedor-principal">
        <div class="tarjeta-login tarjeta-auth">
            <header class="encabezado-login">
                <div class="icono-marca">
                    <span class="material-symbols-outlined icono-relleno">home_app_logo</span>
                </div>
                <h1>Inicia sesión</h1>
                <p>Bienvenido de nuevo a tu hogar inteligente.</p>
            </header>
            <form id="formulario-login" class="formulario-login" novalidate>
                <div class="grupo-formulario">
                    <label for="correo_electronico">Correo electrónico</label>
                    <div class="campo-con-icono">
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" id="correo_electronico" name="correo_electronico" placeholder="tu@correo.com" required>
                    </div>
                    <span id="mensaje-correo" class="mensaje-error"></span>
                </div>
                <div class="grupo-formulario">
                    <div class="encabezado-contrasena">
                        <label for="contrasena">Contraseña</label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="campo-con-icono">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
                        <button type="button" id="boton-mostrar-contrasena" class="boton-visibilidad">
                            <span class="material-symbols-outlined">visibility_off</span>
                        </button>
                    </div>
                    <span id="mensaje-contrasena" class="mensaje-error"></span>
                </div>
                <button type="submit" class="boton-principal">Iniciar sesión</button>
            </form>
            <div class="registro">
                <p>¿No tienes cuenta? <a href="Registro.html">Regístrate</a></p>
            </div>
        </div>
    </main>
    <script src="js/Iniciar-Sesion.js"></script>
</body>
</html>
