<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Registro - Mi Hogar Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Estilos-Globales.css">
    <link rel="stylesheet" href="css/Registro.css">
</head>
<body class="cuerpo-registro">
    <main class="panel-formulario">
        <div class="contenedor-formulario">
            <section class="tarjeta-formulario tarjeta-auth">
                <div class="encabezado-seccion">
                    <h2 class="titulo-formulario">Crea tu cuenta</h2>
                    <p class="subtitulo-formulario">Comienza a organizar tu entorno familiar hoy mismo.</p>
                </div>
                <form id="formulario-registro" class="formulario-registro">
                    <div class="grupo-campo">
                        <label class="etiqueta-campo" for="nombre_completo">Nombre completo</label>
                        <div class="campo-con-icono">
                            <span class="material-symbols-outlined">person</span>
                            <input class="entrada-texto" id="nombre_completo" name="nombre_completo" type="text" placeholder="Ej. Ana García" required>
                        </div>
                    </div>
                    <div class="grupo-campo">
                        <label class="etiqueta-campo" for="correo_electronico">Correo electrónico</label>
                        <div class="campo-con-icono">
                            <span class="material-symbols-outlined">mail</span>
                            <input class="entrada-texto" id="correo_electronico" name="correo_electronico" type="email" placeholder="ana@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="grupo-campo">
                        <label class="etiqueta-campo" for="contrasena">Contraseña</label>
                        <div class="campo-con-icono">
                            <span class="material-symbols-outlined">lock</span>
                            <input class="entrada-texto" id="contrasena" name="contrasena" type="password" placeholder="••••••••" required>
                            <button class="boton-alternar-visibilidad" id="boton-alternar-contrasena" type="button">
                                <span class="material-symbols-outlined" id="icono-visibilidad-contrasena">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <button class="boton-primario-registro boton-principal" type="submit">Crear cuenta</button>
                </form>
                <div class="pie-tarjeta" style="margin-top: 16px; text-align: center;">
                    <p class="texto-pie">¿Ya tienes una cuenta? <a href="Iniciar-Sesion.html" class="enlace-inicio-sesion">Iniciar sesión</a></p>
                </div>
            </section>
        </div>
    </main>
    <script src="js/Registro.js"></script>
</body>
</html>
