<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Eventos - Mi Hogar Inteligente</title>
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Archivo de Estilos CSS -->
    <link rel="stylesheet" href="css/Añadir-Evento.css">
</head>

<body class="cuerpo-pagina">

    <!-- Encabezado Superior -->
    <header class="encabezado-principal">
        <div class="contenedor-logo">
            <span class="material-symbols-outlined icono-marca">tap_and_play</span>
            <span class="texto-marca">Mi Hogar Inteligente</span>
        </div>
        <div>
            <button id="btnNotificaciones" class="boton-icono" type="button" aria-label="Notificaciones">
                <span class="material-symbols-outlined">notifications</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="contenedor-principal">
        
        <!-- Sección Titulo y Cierre -->
        <div class="encabezado-seccion">
            <h1 class="titulo-pagina">Añadir Eventos</h1>
            <button id="btnCerrar" class="boton-icono boton-cerrar" type="button" aria-label="Cerrar">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Tarjeta de Formulario -->
        <div class="tarjeta-formulario">
            <div class="decoracion-fondo"></div>

            <form id="formularioEvento" class="formulario">
                
                <!-- Título del Evento -->
                <div class="campo-grupo">
                    <label class="etiqueta-campo" for="tituloEvento">Título del Evento</label>
                    <input id="tituloEvento" class="entrada-texto" placeholder="ej. Cena familiar, Mantenimiento caldera" type="text" required>
                </div>

                <!-- Tipo de Evento (Selector de Categorías) -->
                <div class="campo-grupo">
                    <label class="etiqueta-campo">Tipo de Evento</label>
                    <div class="contenedor-chips" id="contenedorTipoEvento">
                        
                        <button class="boton-chip chip-activo" type="button" data-tipo="pagos">
                            <span class="material-symbols-outlined icono-chip">payments</span>
                            <span class="texto-chip">Pagos</span>
                        </button>

                        <button class="boton-chip chip-inactivo" type="button" data-tipo="compras">
                            <span class="material-symbols-outlined icono-chip">shopping_cart</span>
                            <span class="texto-chip">Compras</span>
                        </button>

                        <button class="boton-chip chip-inactivo" type="button" data-tipo="mantenimiento">
                            <span class="material-symbols-outlined icono-chip">build</span>
                            <span class="texto-chip">Mantenimiento</span>
                        </button>

                        <button class="boton-chip chip-inactivo" type="button" data-tipo="familiar">
                            <span class="material-symbols-outlined icono-chip">family_restroom</span>
                            <span class="texto-chip">Familiar</span>
                        </button>

                    </div>
                </div>

                <!-- Grilla Fecha/Hora y Ubicación -->
                <div class="grilla-dos-columnas">
                    
                    <!-- Fecha y Hora -->
                    <div class="campo-grupo">
                        <label class="etiqueta-campo" for="fechaHoraEvento">Fecha y Hora</label>
                        <div class="contenedor-input-icono">
                            <span class="icono-posicionado material-symbols-outlined">calendar_month</span>
                            <input id="fechaHoraEvento" class="entrada-texto entrada-con-icono" type="datetime-local" required>
                        </div>
                    </div>

                    <!-- Ubicación -->
                    <div class="campo-grupo">
                        <label class="etiqueta-campo" for="ubicacionEvento">Ubicación <span class="texto-opcional">(Opcional)</span></label>
                        <div class="contenedor-input-icono">
                            <span class="icono-posicionado material-symbols-outlined">location_on</span>
                            <input id="ubicacionEvento" class="entrada-texto entrada-con-icono" placeholder="Añadir ubicación" type="text">
                        </div>
                    </div>

                </div>

                <!-- Notas Adicionales -->
                <div class="campo-grupo">
                    <label class="etiqueta-campo" for="notasEvento">Notas Adicionales</label>
                    <textarea id="notasEvento" class="entrada-texto campo-textarea" placeholder="Detalles extra del evento..." rows="3"></textarea>
                </div>

                <!-- Recordatorio Toggle -->
                <div class="tarjeta-toggle">
                    <div class="info-toggle">
                        <div class="icono-contenedor-toggle">
                            <span class="material-symbols-outlined">notifications_active</span>
                        </div>
                        <div>
                            <p class="titulo-toggle">Recordatorio</p>
                            <p class="subtitulo-toggle">Recibir alerta 30 min antes</p>
                        </div>
                    </div>

                    <label class="switch-toggle">
                        <input id="toggleRecordatorio" type="checkbox" checked>
                        <span class="slider-toggle"></span>
                    </label>
                </div>

                <!-- Botones de Acción -->
                <div class="contenedor-acciones">
                    <button id="btnCancelar" class="boton-accion boton-cancelar" type="button">
                        Cancelar
                    </button>
                    <button class="boton-accion boton-guardar" type="submit">
                        Guardar Evento
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- Archivo de Lógica JavaScript -->
    <script src="js/Añadir-Evento.js"></script>
</body>
</html>
